<section class="preview-grid">
  <article class="preview-card">
    <h2>
      Colocação
      <span class="tag">1080 × 1080</span>
    </h2>
    <p class="drag-hint">Arraste a imagem de cada líder para ajustar a posição vertical.</p>
    <canvas
      #top4Canvas
      class="placement-canvas"
      [class.dragging]="draggingRankIndex !== null"
      width="1080"
      height="1080"
      (pointerdown)="startRankDrag($event)"
      (pointermove)="moveRankDrag($event)"
      (pointerup)="stopRankDrag($event)"
      (pointercancel)="stopRankDrag($event)"
    ></canvas>
  </article>

  <article class="preview-card">
    <h2>
      Roda
      <span class="tag">1080 × 1080</span>
    </h2>
    <p class="drag-hint" *ngIf="state.wheelLeaders.length">Arraste um líder dentro do seu setor para ajustar o enquadramento.</p>
    <canvas
      #wheelCanvas
      class="wheel-canvas"
      [class.dragging]="draggingWheelLeaderIndex !== null"
      width="1080"
      height="1080"
      (pointerdown)="startWheelLeaderDrag($event)"
      (pointermove)="moveWheelLeaderDrag($event)"
      (pointerup)="stopWheelLeaderDrag($event)"
      (pointercancel)="stopWheelLeaderDrag($event)"
    ></canvas>
  </article>
</section>
